services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DECISION_CUTOFF_HOUR_UTC: ${DECISION_CUTOFF_HOUR_UTC:-18}
      FORECAST_LOOKBACK_DAYS: ${FORECAST_LOOKBACK_DAYS:-60}
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [backend]

